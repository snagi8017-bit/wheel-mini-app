<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Колесо удачи</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#111827;color:white;font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
h1{margin:0 0 18px;font-size:26px}
.wheel-wrap{position:relative;width:min(88vw,360px);height:min(88vw,360px)}
canvas{width:100%;height:100%;filter:drop-shadow(0 8px 18px #0008)}
.pointer{position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:34px solid #fff;z-index:3;filter:drop-shadow(0 2px 2px #000)}
button{margin-top:25px;border:0;border-radius:14px;padding:14px 42px;background:#22c55e;color:white;font-size:19px;font-weight:700;box-shadow:0 5px 0 #15803d;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #15803d}
button:disabled{opacity:.55}
#result{margin-top:18px;font-size:20px;font-weight:700;min-height:25px;text-align:center}
small{margin-top:10px;color:#9ca3af}
</style>
</head>
<body>
<h1>🎡 Колесо удачи</h1>
<div class="wheel-wrap">
  <canvas id="wheel" width="720" height="720"></canvas>
  <div class="pointer"></div>
</div>
<button id="spin">КРУТИТЬ</button>
<div id="result"></div>
<small>Нажми кнопку и испытай удачу!</small>

<script>
const prizes = ["💎 100 алмазов","💎 50 алмазов","🎁 Бонус","💎 200 алмазов","⭐ Супер приз","💎 25 алмазов","🎟️ Ещё попытка","💎 75 алмазов"];
const colors = ["#ef4444","#f59e0b","#22c55e","#3b82f6","#8b5cf6","#ec4899","#14b8a6","#f97316"];
const canvas=document.getElementById("wheel"),ctx=canvas.getContext("2d");
const spinBtn=document.getElementById("spin"),result=document.getElementById("result");
let rotation=0, spinning=false;

function draw(){
  const cx=360,cy=360,r=335,n=prizes.length,arc=Math.PI*2/n;
  ctx.clearRect(0,0,720,720);
  for(let i=0;i<n;i++){
    const a=rotation+i*arc;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+arc);ctx.closePath();
    ctx.fillStyle=colors[i];ctx.fill();
    ctx.strokeStyle="#fff";ctx.lineWidth=5;ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(a+arc/2);
    ctx.textAlign="right";ctx.fillStyle="#fff";ctx.font="bold 25px Arial";
    ctx.shadowColor="#000";ctx.shadowBlur=4;
    ctx.fillText(prizes[i],r-18,9);ctx.restore();
  }
  ctx.beginPath();ctx.arc(cx,cy,52,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,40,0,Math.PI*2);ctx.fillStyle="#111827";ctx.fill();
  ctx.fillStyle="#fff";ctx.font="bold 19px Arial";ctx.textAlign="center";ctx.fillText("GO",cx,367);
}
draw();

spinBtn.onclick=()=>{
 if(spinning)return;
 spinning=true;spinBtn.disabled=true;result.textContent="";
 const winner=Math.floor(Math.random()*prizes.length);
 const n=prizes.length,arc=Math.PI*2/n;
 // Pointer is at top (-PI/2). Center winner under pointer.
 const target=-Math.PI/2-(winner+0.5)*arc;
 const current=((rotation%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
 let delta=target-current;
 if(delta<0)delta+=Math.PI*2;
 delta+=Math.PI*2*(5+Math.floor(Math.random()*3));
 const start=rotation,duration=4200,t0=performance.now();
 function anim(t){
   const p=Math.min(1,(t-t0)/duration);
   const ease=1-Math.pow(1-p,4);
   rotation=start+delta*ease;draw();
   if(p<1)requestAnimationFrame(anim);
   else{
     spinning=false;spinBtn.disabled=false;
     result.textContent="🎉 Выпало: "+prizes[winner];
   }
 }
 requestAnimationFrame(anim);
};
</script>
</body>
</html>
